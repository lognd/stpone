name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install AVR toolchain and simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr avrdude cmake ninja-build simavr clang-format clang-tidy

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install
        run: uv sync

      - name: lint
        run: uv run ruff check src/ tests/ scripts/ && uv run ruff format --check src/ tests/ scripts/

      - name: typecheck
        run: uv run ty check src/

      - name: firmware format check
        run: clang-format --dry-run --Werror $(git ls-files 'src/stpalpha/*' 'include/*' 'tests/avr/*' | grep -E '\.(c|cpp|h)$')

      - name: firmware build
        run: uv run python scripts/flash.py --build-only --target all

      - name: test
        run: uv run pytest tests/ --cov=src --cov-report=term-missing

      # frob is not on PyPI (the 0.0.6 there is an unrelated ancestor); install
      # it from its public repository at the same revision the developer
      # machines run. Native extensions are optional and skipped here.
      - name: install frob
        run: uv tool install "frob @ git+https://github.com/lognd/frob@8a13a94dd64586b0fe21fb5c447d22619bf1627d"

      # frob's coverage refresh spawns a bare `pytest`, so the project venv must
      # be first on PATH (FROBLEMS F-017); the stamp it writes is what TEST006
      # checks and it lives in the gitignored .frob/.
      - name: frob coverage
        run: |
          PATH="$PWD/.venv/bin:$PATH" frob coverage --full
          # The refresh rewrites the tracked coverage lock for the runner's
          # own numbers; the stamp it leaves in .frob/ is what the gate needs.
          git checkout -- frob-coverage.lock.json

      # ruff and ty live in the project venv, and frob looks for them on PATH.
      - name: frob check
        run: PATH="$PWD/.venv/bin:$PATH" frob check "$PWD"
