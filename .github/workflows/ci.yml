name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install AVR toolchain and simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr avrdude cmake ninja-build simavr clang-format clang-tidy

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install
        run: uv sync

      - name: lint
        run: uv run ruff check src/ tests/ scripts/ && uv run ruff format --check src/ tests/ scripts/

      - name: typecheck
        run: uv run ty check src/

      - name: firmware format check
        run: clang-format --dry-run --Werror $(git ls-files 'src/stpalpha/*' 'include/*' 'tests/avr/*' | grep -E '\.(c|cpp|h)$')

      - name: firmware build
        run: uv run python scripts/flash.py --build-only --target all

      - name: test
        run: uv run pytest tests/ --cov=src --cov-report=term-missing

  # frob is run locally (frob check) and is not a CI gate for now.

  winder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/winder
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/winder
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked
