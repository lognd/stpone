[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stpone"
version = "1.0.0"
description = "Paper winder upgrade for Sandkey Services by Logan Dapp, LLC: ATmega32U4 firmware, flash tooling, and the desktop serial protocol. All rights reserved."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    { name = "Logan Dapp", email = "logan@logand.app" }
]

dependencies = [
    "pydantic>=2.12",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "typani>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.8",
    "ty>=0.0.1a8",
    "types-pyserial",
]

[project.urls]
Homepage = "https://github.com/lognd/stpone"
Issues = "https://github.com/lognd/stpone/issues"

# Sibling checkouts under ../ are the source of truth while typani is being
# modernized alongside this repo (PyPI still carries 0.0.4).
[tool.uv.sources]
typani = { path = "../typani", editable = true }

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
stpone = ["py.typed", "logging/config.toml"]

# Defaults for scripts/flash.py (CLI flags override these).
[tool.stpone.flash]
build_dir = "build"
target = "firmware"
mcu = "atmega32u4"
programmer = "avr109"
baud = 57600
bootloader_hardware_id = "2341:0036"
port_glob = "/dev/ttyACM*"
attach_timeout_s = 15.0
port_timeout_s = 10.0

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

# The formatter wraps code at 88; E501 only fires past 100 so that indented
# `frob:doc docs/spec/L5-component-design/...#comp-nnnn` directive lines,
# which must stay on one line, are not lint errors.
[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise Unreachable"]
