[package]
name = "winder"
version = "0.1.0"
edition = "2021"
description = "Calibration and debug tool for the paper winder (host link protocol over UART)"
license-file = "../../LICENSE"
publish = false

# Not a member of any other workspace.
[workspace]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
